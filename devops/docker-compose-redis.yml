version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis-dev
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=dev
    command: ["redis-server", "--requirepass", "simple"]
    restart: unless-stopped
  redis2:
    image: redis:latest
    container_name: redis-dev2
    ports:
      - "6380:6380"
    environment:
      - REDIS_PASSWORD=dev
    command: ["redis-server", "--port", "6380", "--requirepass", "simple"]
    restart: unless-stopped
  api01: &api
    image: ghcr.io/4emcos/redis-management-service:latest
    hostname: api01
    environment:
      - quarkus.redis.hosts=redis://redis:6380
      - quarkus.redis.password=simple
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.37"
          memory: "55MB"